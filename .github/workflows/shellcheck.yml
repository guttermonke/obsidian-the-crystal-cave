name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '**/*.bash'
  pull_request:
    branches: [main]
    paths:
      - '**/*.sh'
      - '**/*.bash'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Find all shell scripts
          find . -type f \( -name "*.sh" -o -name "*.bash" \) ! -path "./.git/*" | xargs shellcheck --severity=error
