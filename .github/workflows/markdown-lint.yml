name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**
          config: |
            {
              "MD001": true,
              "MD002": true,
              "MD003": true,
              "MD004": true,
              "MD005": true,
              "MD006": true,
              "MD007": true,
              "MD009": true,
              "MD010": true,
              "MD011": true,
              "MD012": true,
              "MD013": false,
              "MD014": true,
              "MD018": true,
              "MD019": true,
              "MD020": true,
              "MD021": true,
              "MD022": true,
              "MD023": true,
              "MD024": false,
              "MD025": true,
              "MD026": true,
              "MD027": true,
              "MD028": true,
              "MD029": true,
              "MD030": true,
              "MD031": true,
              "MD032": true,
              "MD033": false,
              "MD034": true,
              "MD035": true,
              "MD036": true,
              "MD037": true,
              "MD038": true,
              "MD039": true,
              "MD040": true,
              "MD041": true,
              "MD042": true,
              "MD043": true,
              "MD044": true,
              "MD045": true,
              "MD046": true,
              "MD047": true,
              "MD048": true
            }
